[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluation-lab"
version = "1.0.0"
description = "Production-grade Retrieval-Augmented Generation (RAG) platform with multi-strategy retrieval and automated Ragas evaluation"
authors = [{ name = "AI Engineering Lab" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "qdrant-client>=1.8.0",
    "sentence-transformers>=2.5.0",
    "rank-bm25>=0.2.2",
    "ragas>=0.1.5",
    "google-genai>=0.1.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
